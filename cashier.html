<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<title>Cashier Panel — Neelkanth Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  :root {
    --navy: #1B3A6B; --navy-dark: #142C52; --gold: #F2C200;
    --red: #D62828; --green: #1E7A3A; --cream: #FBF6EC;
    --ink: #1A1A2E; --gray: #E0E0E0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
  body { background: #f4f4f4; color: var(--ink); display: flex; height: 100vh; overflow: hidden; }

  /* Login */
  #login-screen { position: fixed; inset: 0; background: var(--navy-dark); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .login-box { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .login-box h2 { color: var(--navy); margin-bottom: 20px; font-family: 'Cinzel', serif; }
  .login-box input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  .login-box button { width: 100%; padding: 14px; background: var(--gold); color: var(--navy); border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; }

  /* Sidebar */
  .sidebar { width: 260px; background: var(--navy-dark); color: white; padding: 20px; display: flex; flex-direction: column; }
  .sidebar h1 { font-size: 22px; margin-bottom: 5px; color: var(--gold); font-family: 'Cinzel', serif; }
  .sidebar p { font-size: 12px; opacity: 0.7; margin-bottom: 30px; text-transform: uppercase; }
  .sidebar .nav-btn { padding: 14px; margin-bottom: 10px; background: rgba(255,255,255,0.05); border: none; color: white; text-align: left; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .sidebar .nav-btn.active { background: var(--gold); color: var(--navy-dark); }
  .sidebar .logout { margin-top: auto; background: transparent; color: #ff6b6b; padding: 12px; border: 1px solid #ff6b6b; border-radius: 8px; cursor: pointer; font-weight: bold; }

  /* Main */
  .main { flex: 1; padding: 25px; overflow-y: auto; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
  .header h2 { font-size: 26px; color: var(--navy); }
  .connection-status { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; background: var(--gray); color: #666; display: flex; align-items: center; gap: 6px; }
  .connection-status.live { background: #d4edda; color: var(--green); }
  .connection-status.live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(30, 122, 58, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(30, 122, 58, 0); } 100% { box-shadow: 0 0 0 0 rgba(30, 122, 58, 0); } }

  /* Table Tabs Grid */
  .table-tabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .tab-card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 6px solid var(--gold); display: flex; flex-direction: column; overflow: hidden; }
  
  .tab-head { padding: 15px 20px; background: #fafafa; border-bottom: 1px dashed #eee; display: flex; justify-content: space-between; align-items: center; }
  .tab-head h3 { font-family: 'Cinzel', serif; font-size: 20px; color: var(--navy); }
  .bill-id { font-size: 12px; background: var(--navy); color: var(--gold); padding: 4px 8px; border-radius: 4px; font-weight: bold; letter-spacing: 1px; }
  
  .tab-body { padding: 20px; flex: 1; max-height: 250px; overflow-y: auto; }
  .item-row { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
  .item-row span:first-child { font-weight: 600; }
  
  .tab-foot { padding: 20px; background: #fff; border-top: 1px solid #eee; }
  .tab-total { display: flex; justify-content: space-between; font-weight: 800; font-size: 20px; color: var(--navy); margin-bottom: 15px; }
  .btn-generate { width: 100%; padding: 14px; background: var(--green); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; text-transform: uppercase; cursor: pointer; letter-spacing: 1px; }

  .empty-state { text-align: center; padding: 50px; color: #888; font-size: 15px; }

  /* --- BILL MODAL --- */
  #bill-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; display: none; place-items: center; padding: 20px; }
  #bill-modal.show { display: grid; }
  .bill-box { background: white; width: 100%; max-width: 380px; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
  
  .bill-header { text-align: center; padding: 20px; background: var(--navy); color: white; }
  .bill-header img { height: 50px; margin-bottom: 10px; }
  .bill-header h3 { font-family: 'Cinzel', serif; font-size: 20px; color: var(--gold); }
  .bill-header p { font-size: 11px; opacity: 0.8; margin-top: 4px; }
  
  .bill-body { padding: 20px; }
  .bill-info { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-bottom: 15px; border-bottom: 1px dashed #ccc; padding-bottom: 10px; }
  .bill-items { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 15px; }
  .bill-items th { text-align: left; border-bottom: 2px solid #eee; padding-bottom: 5px; font-weight: 700; }
  .bill-items td { padding: 8px 0; border-bottom: 1px solid #f9f9f9; }
  
  .bill-total { display: flex; justify-content: space-between; font-weight: 800; font-size: 18px; color: var(--navy); border-top: 2px dashed #ccc; padding-top: 10px; }
  
  .bill-qr { text-align: center; margin-top: 20px; }
  .bill-qr #qrcode { display: inline-block; padding: 10px; background: white; border: 1px solid #eee; border-radius: 8px; }
  .bill-qr p { font-size: 10px; color: #888; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }
  
  .bill-actions { display: flex; gap: 10px; padding: 20px; background: #f9f9f9; border-top: 1px solid #eee; }
  .bill-actions button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; }
  .btn-print { background: var(--navy); color: white; }
  .btn-paid { background: var(--green); color: white; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-box">
    <h2>Cashier Login</h2>
    <input type="email" id="email" placeholder="Email Address" value="cashier@neelkanth.com" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()" id="login-btn">Login to Panel</button>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar" style="display:none;">
  <h1>Neelkanth Star</h1>
  <p>Cashier Panel</p>
  <button class="nav-btn active" onclick="switchTab('tab-orders', this)">Live Tables</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<!-- MAIN PANEL -->
<div class="main" id="main-panel" style="display:none;">
  <div class="header">
    <h2>Live Table Tabs</h2>
    <div class="connection-status" id="conn-status">Connecting...</div>
  </div>

  <div id="tab-orders" class="tab-content active">
    <div class="table-tabs" id="orders-container"></div>
  </div>
</div>

<!-- BILL MODAL -->
<div id="bill-modal">
  <div class="bill-box">
    <div class="bill-header">
      <img src="neelkanthlogo.png" alt="Logo" onerror="this.style.display='none'">
      <h3>NEELKANTH STAR</h3>
      <p>GT Road, Karnal, Haryana</p>
    </div>
    <div class="bill-body">
      <div class="bill-info">
        <span>Table: <strong id="b-table">-</strong></span>
        <span>Bill ID: <strong id="b-id">-</strong></span>
      </div>
      <table class="bill-items">
        <thead><tr><th>Item</th><th style="text-align:center;">Qty</th><th style="text-align:right;">Price</th></tr></thead>
        <tbody id="b-items"></tbody>
      </table>
      <div class="bill-total">
        <span>Total</span>
        <span id="b-total">₹0</span>
      </div>
      <div class="bill-qr">
        <div id="qrcode"></div>
        <p>Scan to Pay via UPI</p>
      </div>
    </div>
    <div class="bill-actions">
      <button class="btn-print" onclick="window.print()">Print Bill</button>
      <button class="btn-paid" onclick="confirmPayment()">Mark Paid & Close</button>
    </div>
  </div>
</div>

<script>
/* ========================================================= */
/* SUPABASE CONFIG */
/* ========================================================= */
const SUPABASE_URL = 'https://scuiidvmhsyknhqlszzg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjdWlpZHZtaHN5a25ocWxzenpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDgyOTEsImV4cCI6MjEwNzkyNDI5MX0.AiZgUL1lOcp7LHIP1JgQipXbtC-NPCBQjcWJAK_br-0';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let activeTabs = {}; // Stores grouped orders by table_number
let realtimeChannel = null;
let currentBill = null; // Stores the tab being billed

/* ========================================================= */
/* AUTHENTICATION */
/* ========================================================= */
async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  btn.textContent = 'Logging in...';
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { alert(error.message); btn.textContent = 'Login'; }
  else initDashboard();
}

async function logout() { await supabaseClient.auth.signOut(); window.location.reload(); }

async function checkSession() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) initDashboard();
}

function initDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('sidebar').style.display = 'flex';
  document.getElementById('main-panel').style.display = 'block';
  initRealtime();
}

/* ========================================================= */
/* TAB LOGIC & REALTIME */
/* ========================================================= */
async function fetchOrders() {
  // Fetch all active orders (ORDERED, PREPARING, PREPARED)
  const { data, error } = await supabaseClient
    .from('orders')
    .select('*')
    .neq('status', 'PAID')
    .order('created_at', { ascending: true });

  if (error) return;

  // Group orders by Table Number
  activeTabs = {};
  data.forEach(order => {
    if (!activeTabs[order.table_number]) {
      // Create a new Tab for this table
      activeTabs[order.table_number] = {
        table: order.table_number,
        bill_id: `#NK-${5000 + order.id}`, // Unique Bill ID based on first order
        orders: [],
        total: 0
      };
    }
    // Add items to the tab
    activeTabs[order.table_number].orders.push(order);
    activeTabs[order.table_number].total += order.total_amount;
  });

  renderTabs();
}

function initRealtime() {
  const statusEl = document.getElementById('conn-status');
  statusEl.textContent = 'LIVE'; statusEl.classList.add('live');
  fetchOrders();
  if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
  realtimeChannel = supabaseClient.channel('public:orders').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => fetchOrders()).subscribe();
}

function renderTabs() {
  const container = document.getElementById('orders-container');
  container.innerHTML = '';

  const tables = Object.values(activeTabs);
  if (tables.length === 0) {
    container.innerHTML = '<div class="empty-state">No active tables right now.<br>New orders will appear here.</div>';
    return;
  }

  tables.forEach(tab => {
    const card = document.createElement('div');
    card.className = 'tab-card';

    // Flatten all items from all orders in this tab
    let allItems = [];
    tab.orders.forEach(o => {
      if (Array.isArray(o.items)) allItems = allItems.concat(o.items);
    });

    // Group identical items (e.g., if they ordered Dal Makhani twice)
    const groupedItems = {};
    allItems.forEach(item => {
      if (!groupedItems[item.name]) groupedItems[item.name] = { name: item.name, qty: 0, price: item.price };
      groupedItems[item.name].qty += item.qty;
    });

    let itemsHtml = '';
    Object.values(groupedItems).forEach(item => {
      itemsHtml += `<div class="item-row"><span>${item.qty}x ${item.name}</span> <span>₹${item.price * item.qty}</span></div>`;
    });

    card.innerHTML = `
      <div class="tab-head">
        <h3>Table ${tab.table}</h3>
        <span class="bill-id">${tab.bill_id}</span>
      </div>
      <div class="tab-body">
        ${itemsHtml}
      </div>
      <div class="tab-foot">
        <div class="tab-total"><span>Total</span><span>₹${tab.total}</span></div>
        <button class="btn-generate" onclick="openBill(${tab.table})">Generate Bill</button>
      </div>
    `;
    container.appendChild(card);
  });
}

/* ========================================================= */
/* BILL GENERATION */
/* ========================================================= */
function openBill(tableNumber) {
  currentBill = activeTabs[tableNumber];
  if (!currentBill) return;

  // Fill Bill Details
  document.getElementById('b-table').textContent = currentBill.table;
  document.getElementById('b-id').textContent = currentBill.bill_id;
  document.getElementById('b-total').textContent = `₹${currentBill.total}`;

  // Flatten and group items
  let allItems = [];
  currentBill.orders.forEach(o => { allItems = allItems.concat(o.items); });
  const groupedItems = {};
  allItems.forEach(item => {
    if (!groupedItems[item.name]) groupedItems[item.name] = { name: item.name, qty: 0, price: item.price };
    groupedItems[item.name].qty += item.qty;
  });

  const tbody = document.getElementById('b-items');
  tbody.innerHTML = '';
  Object.values(groupedItems).forEach(item => {
    tbody.innerHTML += `<tr><td>${item.name}</td><td style="text-align:center;">${item.qty}</td><td style="text-align:right;">₹${item.price * item.qty}</td></tr>`;
  });

  // Generate UPI QR
  document.getElementById('qrcode').innerHTML = '';
  const upiString = `upi://pay?pa=neelkanthstar@upi&pn=Neelkanth%20Star&am=${currentBill.total}&cu=INR`;
  new QRCode(document.getElementById("qrcode"), {
    text: upiString,
    width: 120, height: 120,
    colorDark : "#1B3A6B", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
  });

  document.getElementById('bill-modal').classList.add('show');
}

async function confirmPayment() {
  if (!currentBill) return;

  // Mark ALL orders for this table as PAID
  const orderIds = currentBill.orders.map(o => o.id);
  
  const { error } = await supabaseClient
    .from('orders')
    .update({ status: 'PAID' })
    .in('id', orderIds);

  if (error) {
    alert("Error marking paid: " + error.message);
  } else {
    document.getElementById('bill-modal').classList.remove('show');
    currentBill = null;
    // The realtime listener will automatically refresh the tabs and remove this table
  }
}

/* INIT */
checkSession();
</script>
</body>
</html>
