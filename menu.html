<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="theme-color" content="#3B1414" />
<title>Menu — Neelkanth Star Dhaba</title>
<meta name="description" content="Neelkanth Star Dhaba — Full menu. Browse, add to cart, order on WhatsApp." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --maroon:#3B1414;
  --wine:#6B1F1F;
  --wine-soft:#8A2E2E;
  --gold:#F2C200;
  --gold-soft:#FFD95A;
  --red:#D62828;
  --purple:#5B2A86;
  --cream:#FBF6EC;
  --cream-2:#F5EDDC;
  --ink:#2A1414;
  --ink-soft:#5A3A3A;
  --green:#1E7A3A;
  --shadow-lg:0 24px 60px -20px rgba(59,20,20,.45);
  --shadow-md:0 12px 32px -14px rgba(59,20,20,.35);
  --shadow-sm:0 6px 18px -10px rgba(59,20,20,.30);
  --radius:16px;
  --radius-lg:22px;
}

*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ scroll-behavior:smooth; }
body{
  font-family:'Inter', system-ui, -apple-system, sans-serif;
  background:var(--cream);
  color:var(--ink);
  min-height:100dvh;
  overflow-x:hidden;
  position:relative;
  line-height:1.5;
  padding-bottom:96px;
}

.bg-stage{
  position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  background:
    radial-gradient(900px 500px at 10% -5%, #6B1F1F14, transparent 60%),
    radial-gradient(800px 500px at 100% 5%, #F2C20014, transparent 55%),
    linear-gradient(180deg,#FBF6EC 0%,#F5EDDC 100%);
}
.orb{
  position:absolute; border-radius:50%; filter:blur(70px); opacity:.32;
  animation:float 22s ease-in-out infinite;
}
.orb.a{ width:280px; height:280px; left:-80px; top:-40px;
  background:radial-gradient(circle at 30% 30%,#F2C200,#D62828 70%); }
.orb.b{ width:240px; height:240px; right:-70px; top:30%;
  background:radial-gradient(circle at 30% 30%,#5B2A86,#6B1F1F 70%); animation-delay:-8s; }
@keyframes float{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(25px,-30px) scale(1.08); }
}

/* ============ TOPBAR ============ */
.topbar{
  position:sticky; top:0; z-index:40;
  background:rgba(251,246,236,.94);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(107,31,31,.12);
  padding:10px 14px;
  display:flex; align-items:center; gap:12px;
}
.topbar .back{
  flex:0 0 auto;
  width:38px; height:38px; border-radius:12px;
  display:grid; place-items:center;
  background:linear-gradient(145deg,var(--maroon),var(--wine));
  color:var(--gold); font-size:17px; text-decoration:none;
  box-shadow:var(--shadow-sm);
  transition:transform .2s;
}
.topbar .back:active{ transform:scale(.92); }
.topbar .brand-mini{
  flex:1; min-width:0;
  display:flex; align-items:center; gap:9px;
}
.topbar .brand-mini img{ width:30px; height:30px; }
.topbar .brand-mini .nm{
  font-family:'Cinzel',serif; font-weight:800;
  color:var(--maroon); font-size:14px;
  letter-spacing:.03em; text-transform:uppercase;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.topbar .cart-btn{
  position:relative;
  flex:0 0 auto;
  width:42px; height:42px; border-radius:12px;
  display:grid; place-items:center;
  background:linear-gradient(145deg,var(--wine),var(--maroon));
  color:var(--gold); font-size:18px; border:none; cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition:transform .25s;
}
.topbar .cart-btn:active{ transform:scale(.94); }
.cart-count{
  position:absolute; top:-6px; right:-6px;
  min-width:20px; height:20px; padding:0 5px;
  border-radius:999px;
  background:var(--red); color:#fff;
  font-size:11px; font-weight:700;
  display:grid; place-items:center;
  border:2px solid var(--cream);
  transform:scale(0); transition:transform .3s cubic-bezier(.2,.8,.25,1);
}
.cart-count.show{ transform:scale(1); }

/* ============ HERO ============ */
.hero{
  position:relative; z-index:1;
  text-align:center;
  padding:26px 18px 6px;
  animation:fadeUp .8s both;
}
.hero h1{
  font-family:'Cinzel',serif;
  font-weight:800;
  font-size:clamp(26px,7.5vw,40px);
  color:var(--maroon);
  letter-spacing:.03em;
}
.hero .sub{
  margin-top:6px;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  color:var(--wine);
  font-size:clamp(14px,4vw,17px);
}
@keyframes fadeUp{
  from{ opacity:0; transform:translateY(14px); }
  to{ opacity:1; transform:translateY(0); }
}

/* ============ CATEGORY CHIPS ============ */
.chips-wrap{
  position:sticky; top:59px; z-index:35;
  background:rgba(251,246,236,.95);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(107,31,31,.10);
  padding:10px 0;
}
.chips{
  display:flex; gap:8px; overflow-x:auto;
  padding:0 14px;
  scrollbar-width:none;
  scroll-snap-type:x proximity;
}
.chips::-webkit-scrollbar{ display:none; }
.chip{
  flex:0 0 auto;
  padding:8px 14px;
  border-radius:999px;
  font-size:12.5px; font-weight:600;
  color:var(--wine);
  background:#fff;
  border:1.5px solid rgba(107,31,31,.18);
  cursor:pointer;
  white-space:nowrap;
  transition:all .25s;
  scroll-snap-align:start;
}
.chip.active{
  background:linear-gradient(135deg,var(--maroon),var(--wine));
  color:var(--gold);
  border-color:var(--maroon);
  box-shadow:var(--shadow-sm);
}
.chip:active{ transform:scale(.96); }

/* ============ MENU ============ */
.menu-wrap{
  position:relative; z-index:1;
  padding:18px 14px 10px;
  max-width:760px; margin:0 auto;
}
.section{
  margin-bottom:32px;
  scroll-margin-top:120px;
}
.section-head{
  display:flex; align-items:center; gap:12px;
  margin-bottom:14px;
}
.section-head .line{
  flex:1; height:1px;
  background:linear-gradient(90deg,transparent,rgba(107,31,31,.3),transparent);
}
.section-head h2{
  font-family:'Cinzel',serif;
  font-weight:700;
  font-size:clamp(15px,4.4vw,19px);
  color:var(--maroon);
  letter-spacing:.08em;
  text-transform:uppercase;
  text-align:center;
  white-space:nowrap;
}

.item{
  display:flex; align-items:flex-start; gap:12px;
  padding:13px 14px;
  background:#fff;
  border:1.5px solid rgba(107,31,31,.10);
  border-radius:var(--radius);
  margin-bottom:9px;
  cursor:pointer;
  transition:transform .25s, box-shadow .25s, border-color .25s;
  box-shadow:0 2px 8px -6px rgba(59,20,20,.3);
}
.item:hover, .item:focus-visible{
  transform:translateY(-2px);
  box-shadow:var(--shadow-sm);
  border-color:rgba(242,194,0,.5);
  outline:none;
}
.item:active{ transform:scale(.995); }

.veg-mark{
  flex:0 0 auto;
  width:16px; height:16px;
  border:1.8px solid var(--green);
  border-radius:3px;
  display:grid; place-items:center;
  margin-top:3px;
}
.veg-mark::after{
  content:""; width:7px; height:7px; border-radius:50%;
  background:var(--green);
}

.item-body{ flex:1; min-width:0; }
.item-name{
  font-weight:600;
  font-size:14.5px;
  color:var(--ink);
  letter-spacing:.01em;
}
.item-price{
  flex:0 0 auto;
  font-family:'Cinzel',serif;
  font-weight:700;
  font-size:14px;
  color:var(--maroon);
  margin-top:2px;
  white-space:nowrap;
}

.menu-note{
  max-width:760px; margin:0 auto 20px;
  padding:16px 18px;
  background:linear-gradient(135deg,rgba(242,194,0,.12),rgba(214,40,40,.06));
  border:1px dashed rgba(107,31,31,.25);
  border-radius:var(--radius);
  font-size:11.5px;
  color:var(--ink-soft);
  line-height:1.6;
  text-align:center;
}
.menu-note strong{ color:var(--maroon); }
.menu-note .row{ display:block; margin-top:3px; }

/* ============ BOTTOM SHEET ============ */
.sheet-overlay{
  position:fixed; inset:0; z-index:60;
  background:rgba(42,20,20,.55);
  backdrop-filter:blur(3px);
  opacity:0; pointer-events:none;
  transition:opacity .3s;
}
.sheet-overlay.show{ opacity:1; pointer-events:auto; }

.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:61;
  background:var(--cream);
  border-radius:26px 26px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(110%);
  transition:transform .38s cubic-bezier(.2,.8,.25,1);
  box-shadow:0 -20px 60px -20px rgba(59,20,20,.5);
  max-width:600px; margin:0 auto;
  max-height:85dvh; overflow-y:auto;
}
.sheet.show{ transform:translateY(0); }
.sheet .grab{
  width:44px; height:4px; border-radius:2px;
  background:rgba(107,31,31,.25);
  margin:0 auto 16px;
}
.sheet h3{
  font-family:'Cinzel',serif;
  font-size:20px; font-weight:700;
  color:var(--maroon);
  letter-spacing:.02em;
}
.sheet .sdesc{
  margin-top:6px; font-size:13px; color:var(--ink-soft); line-height:1.5;
}
.sheet .sprice{
  margin-top:14px;
  font-family:'Cinzel',serif;
  font-size:22px; font-weight:700;
  color:var(--wine);
}
.qty-row{
  display:flex; align-items:center; justify-content:center; gap:18px;
  margin:20px 0 18px;
}
.qty-btn{
  width:44px; height:44px; border-radius:50%;
  border:1.5px solid rgba(107,31,31,.25);
  background:#fff; font-size:20px; font-weight:600;
  color:var(--maroon); cursor:pointer;
  display:grid; place-items:center;
  transition:all .2s;
}
.qty-btn:active{ transform:scale(.9); }
.qty-val{
  font-family:'Cinzel',serif; font-size:22px; font-weight:700;
  color:var(--maroon); min-width:36px; text-align:center;
}
.add-btn{
  width:100%; padding:16px;
  border:none; border-radius:14px;
  background:linear-gradient(135deg,var(--maroon),var(--wine));
  color:var(--gold);
  font-family:'Cinzel',serif; font-weight:700; font-size:15px;
  letter-spacing:.06em; text-transform:uppercase;
  cursor:pointer;
  box-shadow:var(--shadow-md);
  transition:transform .2s;
}
.add-btn:active{ transform:scale(.98); }

/* ============ CART DRAWER ============ */
.cart-overlay{
  position:fixed; inset:0; z-index:70;
  background:rgba(42,20,20,.55);
  backdrop-filter:blur(3px);
  opacity:0; pointer-events:none;
  transition:opacity .3s;
}
.cart-overlay.show{ opacity:1; pointer-events:auto; }

.cart-drawer{
  position:fixed; top:0; right:0; bottom:0; z-index:71;
  width:min(420px,100%);
  background:var(--cream);
  transform:translateX(105%);
  transition:transform .38s cubic-bezier(.2,.8,.25,1);
  display:flex; flex-direction:column;
  box-shadow:-20px 0 60px -20px rgba(59,20,20,.5);
}
.cart-drawer.show{ transform:translateX(0); }
.cart-head{
  padding:18px 20px;
  background:linear-gradient(135deg,var(--maroon),var(--wine));
  color:var(--gold);
  display:flex; align-items:center; justify-content:space-between;
}
.cart-head h3{
  font-family:'Cinzel',serif;
  font-size:18px; font-weight:700; letter-spacing:.05em;
}
.cart-head .close{
  width:34px; height:34px; border-radius:50%;
  background:rgba(242,194,0,.15); color:var(--gold);
  border:none; font-size:18px; cursor:pointer;
  display:grid; place-items:center;
}
.cart-body{
  flex:1; overflow-y:auto;
  padding:16px 18px;
}
.cart-empty{
  text-align:center; padding:60px 20px;
  color:var(--ink-soft); font-size:13.5px;
}
.cart-empty .big{ font-size:44px; margin-bottom:12px; }
.cart-item{
  display:flex; gap:12px; align-items:center;
  padding:12px 0;
  border-bottom:1px dashed rgba(107,31,31,.15);
}
.cart-item .ci-body{ flex:1; min-width:0; }
.cart-item .ci-name{
  font-weight:600; font-size:14px; color:var(--ink);
}
.cart-item .ci-price{
  font-family:'Cinzel',serif; font-weight:700; font-size:13px;
  color:var(--wine); margin-top:2px;
}
.cart-item .ci-qty{
  display:flex; align-items:center; gap:8px;
}
.cart-item .ci-qty button{
  width:28px; height:28px; border-radius:50%;
  border:1.5px solid rgba(107,31,31,.25);
  background:#fff; color:var(--maroon);
  font-size:15px; font-weight:700; cursor:pointer;
  display:grid; place-items:center;
}
.cart-item .ci-qty span{
  font-weight:700; min-width:20px; text-align:center;
  font-family:'Cinzel',serif;
}
.cart-foot{
  padding:16px 18px calc(16px + env(safe-area-inset-bottom));
  background:#fff;
  border-top:1px solid rgba(107,31,31,.12);
}
.cart-total{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:12px;
}
.cart-total .lbl{ font-size:13px; color:var(--ink-soft); }
.cart-total .amt{
  font-family:'Cinzel',serif; font-size:22px; font-weight:800;
  color:var(--maroon);
}
.wa-btn{
  width:100%; padding:15px;
  border:none; border-radius:14px;
  background:linear-gradient(135deg,#25D366,#128C7E);
  color:#fff; font-family:'Cinzel',serif; font-weight:700;
  font-size:14.5px; letter-spacing:.05em; text-transform:uppercase;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:9px;
  box-shadow:0 10px 24px -10px rgba(37,211,102,.6);
  transition:transform .2s;
}
.wa-btn:active{ transform:scale(.98); }
.wa-btn:disabled{ opacity:.5; cursor:not-allowed; }

/* ============ FLOATING CART BAR ============ */
.cart-bar{
  position:fixed; left:14px; right:14px; bottom:14px; z-index:45;
  max-width:760px; margin:0 auto;
  padding:13px 18px;
  background:linear-gradient(135deg,var(--maroon),var(--wine));
  color:var(--gold);
  border-radius:16px;
  display:flex; align-items:center; justify-content:space-between;
  box-shadow:var(--shadow-lg);
  transform:translateY(140%);
  transition:transform .4s cubic-bezier(.2,.8,.25,1);
  cursor:pointer;
  border:1px solid rgba(242,194,0,.25);
}
.cart-bar.show{ transform:translateY(0); }
.cart-bar .left{ display:flex; align-items:center; gap:12px; }
.cart-bar .icon{
  width:36px; height:36px; border-radius:50%;
  background:rgba(242,194,0,.18);
  display:grid; place-items:center; font-size:16px;
}
.cart-bar .info{ line-height:1.2; }
.cart-bar .info .n{
  font-weight:700; font-size:13px; letter-spacing:.03em;
}
.cart-bar .info .t{
  font-family:'Cinzel',serif; font-size:16px; font-weight:800;
  margin-top:2px;
}
.cart-bar .arrow{ font-size:18px; }

/* toast */
.toast{
  position:fixed; left:50%; bottom:100px;
  transform:translate(-50%, 30px);
  background:var(--maroon); color:var(--cream);
  padding:11px 18px; border-radius:999px;
  font-size:13px; font-weight:500;
  box-shadow:var(--shadow-lg);
  opacity:0; pointer-events:none;
  transition:opacity .35s, transform .35s;
  z-index:80;
  border:1px solid rgba(242,194,0,.35);
}
.toast.show{ opacity:1; transform:translate(-50%,0); }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}
</style>
</head>
<body>

<div class="bg-stage" aria-hidden="true">
  <div class="orb a"></div>
  <div class="orb b"></div>
</div>

<!-- TOPBAR -->
<header class="topbar">
  <a class="back" href="index.html" aria-label="Back">←</a>
  <div class="brand-mini">
    <img src="neelkanthlogo.png" alt="" onerror="this.style.display='none'"/>
    <span class="nm">Neelkanth Star Dhaba</span>
  </div>
  <button class="cart-btn" id="cartBtn" aria-label="Open cart">
    🛒
    <span class="cart-count" id="cartCount">0</span>
  </button>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Our Menu</h1>
  <p class="sub">Freshly prepared · Pure vegetarian kitchen</p>
</section>

<!-- CATEGORY CHIPS -->
<div class="chips-wrap">
  <div class="chips" id="chips"></div>
</div>

<!-- MENU -->
<main class="menu-wrap" id="menuWrap"></main>

<!-- NOTE -->
<div class="menu-note">
  <strong>Good to know</strong>
  <span class="row">All items are freshly prepared on order. Please inform us of any allergies.</span>
  <span class="row">Self Food Charges Rs. 30/- per person.</span>
  <span class="row">Taxes extra as applicable.</span>
</div>

<!-- BOTTOM SHEET -->
<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3 id="sheetName">Item</h3>
  <p class="sdesc" id="sheetDesc"></p>
  <div class="sprice" id="sheetPrice">₹0</div>
  <div class="qty-row">
    <button class="qty-btn" id="qtyMinus" aria-label="Decrease">−</button>
    <span class="qty-val" id="qtyVal">1</span>
    <button class="qty-btn" id="qtyPlus" aria-label="Increase">+</button>
  </div>
  <button class="add-btn" id="addBtn">Add to Order</button>
</div>

<!-- CART DRAWER -->
<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer" role="dialog" aria-modal="true">
  <div class="cart-head">
    <h3>Your Order</h3>
    <button class="close" id="cartClose" aria-label="Close">✕</button>
  </div>
  <div class="cart-body" id="cartBody"></div>
  <div class="cart-foot">
    <div class="cart-total">
      <span class="lbl">Subtotal</span>
      <span class="amt" id="cartTotal">₹0</span>
    </div>
    <button class="wa-btn" id="waBtn" disabled>
      <span>📱</span> Order on WhatsApp
    </button>
  </div>
</aside>

<!-- FLOATING CART BAR -->
<div class="cart-bar" id="cartBar">
  <div class="left">
    <div class="icon">🛒</div>
    <div class="info">
      <div class="n" id="barCount">0 items</div>
      <div class="t" id="barTotal">₹0</div>
    </div>
  </div>
  <div class="arrow">→</div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ---------- state ---------- */
let cart = JSON.parse(localStorage.getItem('neelkanth_cart') || '{}');
let activeItem = null;
let activeQty = 1;

/* ---------- helpers ---------- */
const $ = (s)=>document.querySelector(s);
const $$ = (s)=>document.querySelectorAll(s);
const priceLabel = (p)=> (p === "MRP" ? "MRP" : "₹" + p);
const priceNum = (p)=> (typeof p === "number" ? p : 0);

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove("show"), 1900);
}

/* ---------- render chips ---------- */
function renderChips(){
  const wrap = $("#chips");
  MENU.forEach((sec, i)=>{
    const b = document.createElement("button");
    b.className = "chip" + (i === 0 ? " active" : "");
    b.textContent = sec.name;
    b.dataset.target = "sec-" + sec.id;
    b.addEventListener("click", ()=>{
      const el = document.getElementById("sec-" + sec.id);
      if (el){
        const y = el.getBoundingClientRect().top + window.scrollY - 120;
        window.scrollTo({ top:y, behavior:"smooth" });
      }
    });
    wrap.appendChild(b);
  });
}

/* ---------- render menu ---------- */
function renderMenu(){
  const wrap = $("#menuWrap");
  MENU.forEach(sec=>{
    const s = document.createElement("section");
    s.className = "section";
    s.id = "sec-" + sec.id;
    s.innerHTML = `
      <div class="section-head">
        <span class="line"></span>
        <h2>${sec.name}</h2>
        <span class="line"></span>
      </div>
    `;
    sec.items.forEach(item=>{
      const el = document.createElement("div");
      el.className = "item";
      el.tabIndex = 0;
      el.innerHTML = `
        <span class="veg-mark" aria-label="Veg"></span>
        <div class="item-body">
          <div class="item-name">${item.n}</div>
        </div>
        <div class="item-price">${priceLabel(item.p)}</div>
      `;
      const open = ()=> openSheet(sec, item);
      el.addEventListener("click", open);
      el.addEventListener("keydown", (e)=>{
        if (e.key === "Enter" || e.key === " "){ e.preventDefault(); open(); }
      });
      s.appendChild(el);
    });
    wrap.appendChild(s);
  });
}

/* ---------- scroll spy ---------- */
function initScrollSpy(){
  const sections = $$(".section");
  const chips = $$(".chip");
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if (en.isIntersecting){
        const id = en.target.id.replace("sec-","");
        chips.forEach(c=> c.classList.toggle("active", c.dataset.target === en.target.id));
        const activeChip = document.querySelector('.chip.active');
        if (activeChip){
          activeChip.scrollIntoView({ behavior:"smooth", inline:"center", block:"nearest" });
        }
      }
    });
  }, { rootMargin:"-120px 0px -70% 0px", threshold:0 });
  sections.forEach(s=> obs.observe(s));
}

/* ---------- bottom sheet ---------- */
function openSheet(sec, item){
  activeItem = { ...item, section: sec.name };
  activeQty = 1;
  $("#sheetName").textContent = item.n;
  $("#sheetDesc").textContent = sec.name;
  $("#sheetPrice").textContent = priceLabel(item.p);
  $("#qtyVal").textContent = "1";
  $("#sheetOverlay").classList.add("show");
  $("#sheet").classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeSheet(){
  $("#sheetOverlay").classList.remove("show");
  $("#sheet").classList.remove("show");
  document.body.style.overflow = "";
  activeItem = null;
}

$("#qtyMinus").addEventListener("click", ()=>{
  if (activeQty > 1){ activeQty--; $("#qtyVal").textContent = activeQty; }
});
$("#qtyPlus").addEventListener("click", ()=>{
  activeQty++; $("#qtyVal").textContent = activeQty;
});
$("#sheetOverlay").addEventListener("click", closeSheet);
$("#addBtn").addEventListener("click", ()=>{
  if (!activeItem) return;
  const key = activeItem.n + "|" + activeItem.p;
  if (!cart[key]){
    cart[key] = { name: activeItem.n, price: activeItem.p, qty: 0, section: activeItem.section };
  }
  cart[key].qty += activeQty;
  saveCart();
  closeSheet();
  toast("✅ Added to order");
});

/* ---------- cart ---------- */
function saveCart(){
  localStorage.setItem('neelkanth_cart', JSON.stringify(cart));
  renderCart();
  updateBadges();
}

function cartCount(){
  return Object.values(cart).reduce((a, c)=> a + c.qty, 0);
}
function cartTotal(){
  return Object.values(cart).reduce((a, c)=> a + priceNum(c.price) * c.qty, 0);
}
function hasMRP(){
  return Object.values(cart).some(c=> c.price === "MRP");
}

function updateBadges(){
  const n = cartCount();
  const cc = $("#cartCount");
  if (n > 0){ cc.textContent = n; cc.classList.add("show"); }
  else { cc.classList.remove("show"); }

  const bar = $("#cartBar");
  if (n > 0){
    bar.classList.add("show");
    $("#barCount").textContent = n + (n === 1 ? " item" : " items");
    $("#barTotal").textContent = hasMRP() ? "₹" + cartTotal() + "+" : "₹" + cartTotal();
  } else {
    bar.classList.remove("show");
  }
}

function renderCart(){
  const body = $("#cartBody");
  const keys = Object.keys(cart);
  if (keys.length === 0){
    body.innerHTML = `<div class="cart-empty"><div class="big">🛒</div>Your cart is empty.<br/>Tap any item to add it.</div>`;
  } else {
    body.innerHTML = "";
    keys.forEach(k=>{
      const c = cart[k];
      const el = document.createElement("div");
      el.className = "cart-item";
      el.innerHTML = `
        <div class="ci-body">
          <div class="ci-name">${c.name}</div>
          <div class="ci-price">${priceLabel(c.price)}</div>
        </div>
        <div class="ci-qty">
          <button data-act="dec" data-k="${k}">−</button>
          <span>${c.qty}</span>
          <button data-act="inc" data-k="${k}">+</button>
        </div>
      `;
      body.appendChild(el);
    });
    body.querySelectorAll("button").forEach(b=>{
      b.addEventListener("click", ()=>{
        const k = b.dataset.k;
        if (b.dataset.act === "inc") cart[k].qty++;
        else {
          cart[k].qty--;
          if (cart[k].qty <= 0) delete cart[k];
        }
        saveCart();
      });
    });
  }
  const t = cartTotal();
  $("#cartTotal").textContent = hasMRP() ? "₹" + t + " + MRP" : "₹" + t;
  $("#waBtn").disabled = keys.length === 0;
}

/* ---------- cart drawer ---------- */
function openCart(){
  $("#cartOverlay").classList.add("show");
  $("#cartDrawer").classList.add("show");
  document.body.style.overflow = "hidden";
}
function closeCart(){
  $("#cartOverlay").classList.remove("show");
  $("#cartDrawer").classList.remove("show");
  document.body.style.overflow = "";
}
$("#cartBtn").addEventListener("click", openCart);
$("#cartBar").addEventListener("click", openCart);
$("#cartClose").addEventListener("click", closeCart);
$("#cartOverlay").addEventListener("click", closeCart);

/* ---------- WhatsApp order ---------- */
$("#waBtn").addEventListener("click", ()=>{
  const keys = Object.keys(cart);
  if (keys.length === 0) return;
  let msg = "Hello Neelkanth! 👋%0A%0AI'd like to place an order:%0A%0A";
  keys.forEach(k=>{
    const c = cart[k];
    msg += `• ${c.qty} × ${c.name} — ${priceLabel(c.price)}%0A`;
  });
  msg += `%0A*Subtotal:* ${hasMRP() ? "₹" + cartTotal() + " + MRP items" : "₹" + cartTotal()}`;
  msg += `%0A(Self Food Charges ₹30/person + taxes extra)%0A%0AName: %0ATable No: `;
  const url = `https://wa.me/${WA_NUMBER}?text=${msg}`;
  window.open(url, "_blank");
});

/* ---------- init ---------- */
renderChips();
renderMenu();
renderCart();
updateBadges();
initScrollSpy();
</script>
